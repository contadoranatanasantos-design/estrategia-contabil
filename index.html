<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estratégia Contábil — Sistema de Gestão</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #1B2A4A;
      --gold: #B8922A;
      --gold-light: #FFF8EC;
      --surface-0: #F8F9FA;
      --surface-1: #FFFFFF;
      --surface-2: #F1F3F5;
      --border: #E5E7EB;
      --text-primary: #111827;
      --text-secondary: #4B5563;
      --text-muted: #9CA3AF;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --radius: 8px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--surface-0); }

    /* LOGIN */
    .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--navy); }
    .login-box { background: #fff; border-radius: 16px; padding: 40px; width: 380px; text-align: center; }
    .login-logo { width: 160px; margin-bottom: 24px; }
    .login-title { font-size: 18px; font-weight: 600; color: var(--navy); margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
    .login-field { text-align: left; margin-bottom: 16px; }
    .login-field label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
    .login-field input { width: 100%; height: 40px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--border); font-size: 14px; }
    .login-field input:focus { outline: none; border-color: var(--gold); }
    .login-btn { width: 100%; height: 42px; background: var(--navy); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; }
    .login-btn:hover { background: #243659; }
    .login-error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; }

    /* APP */
    .app { display: flex; height: 100vh; }
    .sidebar { width: 230px; min-width: 230px; background: var(--navy); display: flex; flex-direction: column; }
    .logo-area { padding: 20px 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }
    .logo-area img { width: 140px; filter: brightness(0) invert(1); }
    .nav { padding: 16px 10px; flex: 1; overflow-y: auto; }
    .nav-section { font-size: 10px; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 1px; padding: 12px 12px 4px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius); cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 2px; transition: all 0.15s; }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-item.active { background: var(--gold); color: #fff; }
    .nav-item i { font-size: 16px; }
    .sidebar-footer { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.1); }
    .user-row { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; flex-shrink: 0; }
    .user-name { font-size: 12px; color: #fff; font-weight: 500; }
    .user-role { font-size: 11px; color: rgba(255,255,255,0.4); }
    .logout-btn { background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 16px; margin-left: auto; }
    .logout-btn:hover { color: #fff; }
    .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .topbar { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: #fff; position: sticky; top: 0; z-index: 10; }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--navy); }
    .topbar-badge { font-size: 11px; padding: 3px 10px; border-radius: 99px; background: var(--gold-light); color: var(--gold); border: 1px solid var(--gold); font-weight: 500; }
    .content { padding: 24px; flex: 1; }
    .page { display: none; }
    .page.active { display: block; }

    /* CARDS */
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .metric { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; border-left: 3px solid var(--gold); }
    .metric-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
    .metric-value { font-size: 22px; font-weight: 600; color: var(--navy); }
    .metric-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .card-header { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .card-title { font-size: 14px; font-weight: 600; color: var(--navy); }
    .card-body { padding: 20px; }

    /* TABELA */
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.5px; background: var(--surface-0); }
    .table td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-primary); vertical-align: middle; }
    .table tr:last-child td { border-bottom: none; }
    .table tr:hover td { background: var(--surface-0); }

    /* BADGES */
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
    .badge-success { background: #dcfce7; color: var(--success); }
    .badge-warning { background: #fef3c7; color: var(--warning); }
    .badge-danger { background: #fee2e2; color: var(--danger); }
    .badge-info { background: #dbeafe; color: #1d4ed8; }
    .badge-navy { background: #e8ecf3; color: var(--navy); }
    .badge-gold { background: var(--gold-light); color: var(--gold); }

    /* BOTÕES */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: #fff; color: var(--text-primary); font-size: 13px; cursor: pointer; font-weight: 500; transition: all 0.15s; }
    .btn:hover { background: var(--surface-0); }
    .btn-navy { background: var(--navy); color: #fff; border-color: var(--navy); }
    .btn-navy:hover { background: #243659; }
    .btn-gold { background: var(--gold); color: #fff; border-color: var(--gold); }
    .btn-gold:hover { opacity: 0.9; }
    .btn-danger { color: var(--danger); border-color: #fca5a5; }
    .btn-danger:hover { background: #fee2e2; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-success { background: var(--success); color: #fff; border-color: var(--success); }

    /* FORMULÁRIOS */
    .form-grid { display: grid; gap: 14px; }
    .form-grid-2 { grid-template-columns: 1fr 1fr; }
    .form-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .field input, .field select, .field textarea { height: 38px; padding: 0 10px; border-radius: var(--radius); border: 1px solid var(--border); background: #fff; color: var(--text-primary); font-size: 13px; font-family: inherit; }
    .field textarea { height: auto; min-height: 80px; padding: 10px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--navy); }

    /* MODAL */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 28px; width: 500px; max-height: 90vh; overflow-y: auto; }
    .modal-lg { width: 680px; }
    .modal-title { font-size: 16px; font-weight: 600; color: var(--navy); margin-bottom: 4px; }
    .modal-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }

    /* ABAS DO MODAL */
    .modal-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .modal-tab { padding: 8px 16px; font-size: 13px; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .modal-tab.active { color: var(--navy); border-bottom-color: var(--gold); font-weight: 500; }

    /* PROGRESSO */
    .progress-bar { background: var(--surface-2); border-radius: 99px; height: 6px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; transition: width 0.4s; }
    .fill-gold { background: var(--gold); }
    .fill-navy { background: var(--navy); }
    .fill-success { background: var(--success); }
    .fill-danger { background: var(--danger); }
    .fill-warning { background: var(--warning); }

    /* TOAST */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 24px; border-radius: var(--radius); font-size: 13px; font-weight: 500; display: none; align-items: center; gap: 8px; z-index: 9999; }
    .toast.show { display: flex; }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }

    /* CONFIRM */
    .confirm-modal { width: 380px; }
    .confirm-icon { width: 48px; height: 48px; border-radius: 50%; background: #fee2e2; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
    .confirm-icon i { font-size: 24px; color: var(--danger); }

    /* WELCOME */
    .welcome { margin-bottom: 24px; }
    .welcome-title { font-size: 20px; font-weight: 600; color: var(--navy); margin-bottom: 4px; }
    .welcome-sub { font-size: 13px; color: var(--text-muted); }
    .welcome-sub span { color: var(--gold); font-weight: 500; }

    /* DEMANDAS */
    .obrig-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; cursor: pointer; transition: all 0.15s; margin-bottom: 10px; }
    .obrig-card:hover { border-color: var(--gold); }
    .obrig-card.concluida { border-color: var(--success); background: #f0fdf4; }
    .obrig-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .obrig-icon { width: 36px; height: 36px; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }

    /* LOADING */
    .loading { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--text-muted); font-size: 13px; gap: 8px; }

    @media print {
      .sidebar, .topbar, .btn, .nav-item { display: none !important; }
      .main { overflow: visible; }
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page" class="login-page">
  <div class="login-box">
    <img src="logo.png" alt="Estratégia Contábil" class="login-logo">
    <div class="login-title">Bem-vinda!</div>
    <div class="login-sub">Acesse o sistema de gestão do seu escritório</div>
    <div class="login-field">
      <label>E-mail</label>
      <input type="email" id="login-email" placeholder="seu@email.com" value="natana@estrategiacontabil.com.br">
    </div>
    <div class="login-field">
      <label>Senha</label>
      <input type="password" id="login-senha" placeholder="••••••••" value="">
    </div>
    <button class="login-btn" onclick="fazerLogin()">Entrar</button>
    <div class="login-error" id="login-error">E-mail ou senha incorretos.</div>
  </div>
</div>

<!-- APP -->
<div id="app" class="app" style="display:none">
  <div class="sidebar">
    <div class="logo-area">
      <img src="logo.png" alt="Estratégia Contábil">
    </div>
    <nav class="nav" id="sidebar-nav"></nav>
    <div class="sidebar-footer">
      <div class="user-row">
        <div class="user-avatar" id="user-avatar">NS</div>
        <div>
          <div class="user-name" id="user-name">Natana Santos</div>
          <div class="user-role" id="user-role">Contadora</div>
        </div>
        <button class="logout-btn" onclick="fazerLogout()" title="Sair"><i class="ti ti-logout"></i></button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="page-title">Dashboard</div>
      <div class="topbar-badge" id="topbar-mes">Carregando...</div>
    </div>
    <div class="content" id="main-content">
      <!-- Páginas carregadas dinamicamente -->
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL CONFIRMAÇÃO -->
<div class="overlay" id="overlay-confirm">
  <div class="modal confirm-modal">
    <div class="confirm-icon"><i class="ti ti-trash"></i></div>
    <div class="modal-title" id="confirm-title">Confirmar exclusão</div>
    <div class="modal-sub" id="confirm-msg">Tem certeza que deseja excluir este item?</div>
    <div class="modal-footer">
      <button class="btn" onclick="fecharConfirm()">Cancelar</button>
      <button class="btn btn-danger" id="confirm-btn">Sim, excluir</button>
    </div>
  </div>
</div>

<script>
// =====================
// CONFIGURAÇÃO SUPABASE
// =====================
const SUPABASE_URL = 'https://kkfejhkxxgcyfdqjlysg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KyMX7Ju85qr8Cq8IGpVfcg_Zl_isWEP';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// =====================
// ESTADO GLOBAL
// =====================
let usuarioLogado = null;
let perfilUsuario = 'admin'; // admin ou colaborador
const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const hoje = new Date();

// =====================
// AUTENTICAÇÃO
// =====================
async function fazerLogin() {
  const email = document.getElementById('login-email').value;
  const senha = document.getElementById('login-senha').value;
  const erro = document.getElementById('login-error');
  erro.style.display = 'none';

  const { data, error } = await supabase.auth.signInWithPassword({ email, password: senha });
  if (error) {
    erro.style.display = 'block';
    return;
  }
  usuarioLogado = data.user;
  iniciarApp();
}

async function fazerLogout() {
  await supabase.auth.signOut();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-page').style.display = 'flex';
}

async function verificarSessao() {
  const { data } = await supabase.auth.getSession();
  if (data.session) {
    usuarioLogado = data.session.user;
    iniciarApp();
  }
}

function iniciarApp() {
  document.getElementById('login-page').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  const mes = meses[hoje.getMonth()] + ' ' + hoje.getFullYear();
  document.getElementById('topbar-mes').textContent = mes;
  renderSidebar();
  navegarPara('dashboard');
}

// =====================
// SIDEBAR
// =====================
const navAdmin = [
  { section: 'Principal' },
  { id: 'dashboard', label: 'Dashboard', icon: 'ti-layout-dashboard' },
  { id: 'clientes', label: 'Clientes', icon: 'ti-users' },
  { section: 'Operacional' },
  { id: 'demandas', label: 'Demandas', icon: 'ti-checkbox' },
  { section: 'Financeiro' },
  { id: 'receber', label: 'Contas a receber', icon: 'ti-trending-up' },
  { id: 'pagar', label: 'Contas a pagar', icon: 'ti-trending-down' },
  { section: 'Sistema' },
  { id: 'configuracoes', label: 'Configurações', icon: 'ti-settings' },
  { id: 'usuarios', label: 'Usuários', icon: 'ti-users-group' },
];

const navColab = [
  { section: 'Principal' },
  { id: 'dashboard', label: 'Dashboard', icon: 'ti-layout-dashboard' },
  { id: 'clientes', label: 'Clientes', icon: 'ti-users' },
  { section: 'Operacional' },
  { id: 'demandas', label: 'Demandas', icon: 'ti-checkbox' },
];

function renderSidebar() {
  const nav = document.getElementById('sidebar-nav');
  const items = perfilUsuario === 'admin' ? navAdmin : navColab;
  nav.innerHTML = '';
  items.forEach(item => {
    if (item.section) {
      nav.innerHTML += `<div class="nav-section">${item.section}</div>`;
    } else {
      nav.innerHTML += `<div class="nav-item" id="nav-${item.id}" onclick="navegarPara('${item.id}')"><i class="ti ${item.icon}"></i> ${item.label}</div>`;
    }
  });
}

function navegarPara(pagina) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  const navItem = document.getElementById('nav-' + pagina);
  if (navItem) navItem.classList.add('active');
  const titulos = {
    dashboard: 'Dashboard', clientes: 'Clientes', demandas: 'Demandas',
    receber: 'Contas a receber', pagar: 'Contas a pagar',
    configuracoes: 'Configurações', usuarios: 'Usuários'
  };
  document.getElementById('page-title').textContent = titulos[pagina] || pagina;
  carregarPagina(pagina);
}

function carregarPagina(pagina) {
  const content = document.getElementById('main-content');
  content.innerHTML = `<div class="loading"><i class="ti ti-loader"></i> Carregando...</div>`;
  setTimeout(() => {
    if (pagina === 'dashboard') renderDashboard();
    else if (pagina === 'clientes') renderClientes();
    else if (pagina === 'demandas') renderDemandas();
    else if (pagina === 'receber') renderReceber();
    else if (pagina === 'pagar') renderPagar();
    else if (pagina === 'configuracoes') renderConfiguracoes();
    else if (pagina === 'usuarios') renderUsuarios();
  }, 300);
}

// =====================
// DASHBOARD
// =====================
function renderDashboard() {
  const content = document.getElementById('main-content');
  content.innerHTML = `
    <div class="welcome">
      <div class="welcome-title">Bom dia, Natana! 👋</div>
      <div class="welcome-sub">Aqui está o resumo do seu escritório hoje.</div>
    </div>
    <div class="grid-4">
      <div class="metric"><div class="metric-label">Clientes ativos</div><div class="metric-value" id="d-clientes">—</div></div>
      <div class="metric"><div class="metric-label">Demandas do mês</div><div class="metric-value" id="d-demandas">—</div><div class="metric-sub" id="d-demandas-sub"></div></div>
      <div class="metric"><div class="metric-label">Honorários a receber</div><div class="metric-value" id="d-receber">—</div></div>
      <div class="metric"><div class="metric-label">Despesas do mês</div><div class="metric-value" id="d-despesas">—</div></div>
    </div>
    <div class="grid-2">
      <div class="card">
        <div class="card-header"><div class="card-title"><i class="ti ti-bell" style="color:var(--gold)"></i> Alertas de prazo</div></div>
        <div class="card-body" id="d-alertas"><div class="loading"><i class="ti ti-loader"></i> Carregando...</div></div>
      </div>
      <div class="card">
        <div class="card-header"><div class="card-title"><i class="ti ti-chart-bar" style="color:var(--gold)"></i> Resumo financeiro</div></div>
        <div class="card-body" id="d-financeiro"><div class="loading"><i class="ti ti-loader"></i> Carregando...</div></div>
      </div>
    </div>
  `;
  // Dados simulados por enquanto
  document.getElementById('d-clientes').textContent = '0';
  document.getElementById('d-demandas').textContent = '0';
  document.getElementById('d-receber').textContent = 'R$ 0,00';
  document.getElementById('d-despesas').textContent = 'R$ 0,00';
  document.getElementById('d-alertas').innerHTML = '<p style="color:var(--text-muted);font-size:13px">Nenhum alerta no momento.</p>';
  document.getElementById('d-financeiro').innerHTML = '<p style="color:var(--text-muted);font-size:13px">Configure seus clientes e honorários para ver o resumo.</p>';
}

// =====================
// CLIENTES
// =====================
function renderClientes() {
  const content = document.getElementById('main-content');
  content.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:14px;font-weight:600;color:var(--navy)">Clientes cadastrados</div>
      <button class="btn btn-navy" onclick="abrirModalCliente()"><i class="ti ti-plus"></i> Novo cliente</button>
    </div>
    <div class="card">
      <table class="table">
        <thead><tr><th>Empresa</th><th>CNPJ</th><th>Regime</th><th>Categoria</th>${perfilUsuario==='admin'?'<th>Honorários</th>':''}<th>Status</th><th>Ações</th></tr></thead>
        <tbody id="clientes-body"><tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-muted)">Nenhum cliente cadastrado ainda.</td></tr></tbody>
      </table>
    </div>
    <!-- MODAL CLIENTE -->
    <div class="overlay" id="overlay-cliente">
      <div class="modal modal-lg">
        <div class="modal-title">Cadastrar novo cliente</div>
        <div class="modal-sub">Preencha as informações do cliente</div>
        <div class="modal-tabs">
          <div class="modal-tab active" onclick="showModalTab(0,this)"><i class="ti ti-building"></i> Dados cadastrais</div>
          <div class="modal-tab" onclick="showModalTab(1,this)"><i class="ti ti-checkbox"></i> Obrigações</div>
          <div class="modal-tab" onclick="showModalTab(2,this)"><i class="ti ti-currency-dollar"></i> Honorários</div>
          <div class="modal-tab" onclick="showModalTab(3,this)"><i class="ti ti-notes"></i> Observações</div>
        </div>
        <div id="modal-tab-0" class="modal-tab-content">
          <div class="form-grid form-grid-2" style="margin-bottom:14px">

function abrirModalCliente() {
  document.getElementById('overlay-cliente').classList.add('show');
}

function fecharModalCliente() {
  document.getElementById('overlay-cliente').classList.remove('show');
}

function showModalTab(idx, el) {
  document.querySelectorAll('.modal-tab-content').forEach((t,i) => t.style.display = i===idx?'block':'none');
  document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

function salvarCliente() {
  showToast('Cliente salvo com sucesso!', 'success');
  fecharModalCliente();
}

// =====================

function showToast(msg, tipo='') {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.className = `toast show ${tipo}`;
  setTimeout(() => toast.className = 'toast', 3000);
}

let confirmCallback = null;
function confirmar(titulo, msg, callback) {
  document.getElementById('confirm-title').textContent = titulo;
  document.getElementById('confirm-msg').textContent = msg;
  confirmCallback = callback;
  document.getElementById('overlay-confirm').classList.add('show');
  document.getElementById('confirm-btn').onclick = () => { fecharConfirm(); callback(); };
}

function fecharConfirm() {
  document.getElementById('overlay-confirm').classList.remove('show');
}
