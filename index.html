<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estratégia Contábil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy: #1B2A4A; --gold: #B8922A; --gold-light: #FFF8EC; --surface-0: #F8F9FA; --border: #E5E7EB; --text-primary: #111827; --text-muted: #9CA3AF; --success: #16a34a; --danger: #dc2626; --warning: #d97706; --radius: 8px; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--navy); }
    .login-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #fff; border-radius: 16px; padding: 40px; width: 380px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    .login-logo { width: 180px; margin-bottom: 24px; }
    .login-title { font-size: 20px; font-weight: 700; color: var(--navy); margin-bottom: 6px; }
    .login-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 28px; }
    .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px; text-align: left; }
    .field label { font-size: 12px; color: #4B5563; font-weight: 500; }
    .field input, .field select, .field textarea { height: 38px; padding: 0 10px; border-radius: var(--radius); border: 1.5px solid var(--border); font-size: 13px; font-family: inherit; width: 100%; }
    .field textarea { height: auto; min-height: 80px; padding: 10px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--navy); }
    .login-btn { width: 100%; height: 44px; background: var(--navy); color: #fff; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; }
    .login-btn:hover { background: #243659; }
    .login-error { color: var(--danger); font-size: 13px; margin-top: 12px; padding: 8px 12px; background: #fee2e2; border-radius: var(--radius); display: none; }
    .app { display: flex; height: 100vh; background: var(--surface-0); }
    .sidebar { width: 230px; min-width: 230px; background: var(--navy); display: flex; flex-direction: column; }
    .logo-area { padding: 20px 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; }
    .logo-area img { width: 140px; }
    .nav { padding: 16px 10px; flex: 1; overflow-y: auto; }
    .nav-section { font-size: 10px; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 1px; padding: 12px 12px 4px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: var(--radius); cursor: pointer; font-size: 13px; color: rgba(255,255,255,0.6); margin-bottom: 2px; transition: all 0.15s; }
    .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-item.active { background: var(--gold); color: #fff; }
    .sidebar-footer { padding: 14px 16px; border-top: 1px solid rgba(255,255,255,0.1); }
    .user-row { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #fff; flex-shrink: 0; }
    .user-name { font-size: 12px; color: #fff; font-weight: 500; }
    .user-role { font-size: 11px; color: rgba(255,255,255,0.4); }
    .logout-btn { background: none; border: none; color: rgba(255,255,255,0.4); cursor: pointer; font-size: 16px; margin-left: auto; }
    .logout-btn:hover { color: #fff; }
    .main { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
    .topbar { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: #fff; position: sticky; top: 0; z-index: 10; }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--navy); }
    .topbar-badge { font-size: 11px; padding: 3px 10px; border-radius: 99px; background: var(--gold-light); color: var(--gold); border: 1px solid var(--gold); font-weight: 500; }
    .content { padding: 24px; flex: 1; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
    .metric { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; border-left: 3px solid var(--gold); }
    .metric-label { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
    .metric-value { font-size: 22px; font-weight: 600; color: var(--navy); }
    .metric-sub { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    .card-header { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .card-title { font-size: 14px; font-weight: 600; color: var(--navy); }
    .card-body { padding: 20px; }
    .table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .table th { text-align: left; padding: 10px 16px; font-size: 11px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); text-transform: uppercase; letter-spacing: 0.5px; background: #F9FAFB; }
    .table td { padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text-primary); vertical-align: middle; }
    .table tr:last-child td { border-bottom: none; }
    .table tr:hover td { background: #F9FAFB; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 500; }
    .badge-success { background: #dcfce7; color: var(--success); }
    .badge-warning { background: #fef3c7; color: var(--warning); }
    .badge-danger { background: #fee2e2; color: var(--danger); }
    .badge-info { background: #dbeafe; color: #1d4ed8; }
    .badge-navy { background: #e8ecf3; color: var(--navy); }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius); border: 1px solid var(--border); background: #fff; color: var(--text-primary); font-size: 13px; cursor: pointer; font-weight: 500; transition: all 0.15s; }
    .btn:hover { background: var(--surface-0); }
    .btn-navy { background: var(--navy); color: #fff; border-color: var(--navy); }
    .btn-navy:hover { background: #243659; }
    .btn-gold { background: var(--gold); color: #fff; border-color: var(--gold); }
    .btn-danger { color: var(--danger); border-color: #fca5a5; }
    .btn-danger:hover { background: #fee2e2; }
    .btn-success { background: var(--success); color: #fff; border-color: var(--success); }
    .btn-warning { background: var(--warning); color: #fff; border-color: var(--warning); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .form-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 1000; }
    .overlay.show { display: flex; }
    .modal { background: #fff; border-radius: 16px; padding: 28px; width: 560px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 16px; font-weight: 600; color: var(--navy); margin-bottom: 4px; }
    .modal-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    .modal-tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
    .modal-tab { padding: 8px 16px; font-size: 13px; color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .modal-tab.active { color: var(--navy); border-bottom-color: var(--gold); font-weight: 500; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 12px 24px; border-radius: var(--radius); font-size: 13px; font-weight: 500; display: none; z-index: 9999; }
    .toast.show { display: block; }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
    .empty-state { text-align: center; padding: 48px; color: var(--text-muted); }
    .empty-state i { font-size: 48px; margin-bottom: 12px; display: block; }
    .obrig-check-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #F9FAFB; border: 1px solid var(--border); border-radius: var(--radius); cursor: pointer; margin-bottom: 8px; }
    .obrig-check-item.selected { border-color: var(--navy); background: #EEF2FF; }
    .obrig-check-item input[type=checkbox] { width: 16px; height: 16px; cursor: pointer; }
    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .page-header-title { font-size: 15px; font-weight: 600; color: var(--navy); }
  </style>
</head>
<body>

<div id="login-page" class="login-page">
  <div class="login-box">
    <img src="logo.png" alt="Estratégia Contábil" class="login-logo">
    <div class="login-title">Bem-vinda!</div>
    <div class="login-sub">Acesse o sistema de gestão do seu escritório</div>
    <div class="field"><label>E-mail</label><input type="email" id="login-email" placeholder="seu@email.com"></div>
    <div class="field"><label>Senha</label><input type="password" id="login-senha" placeholder="••••••••"></div>
    <button class="login-btn" id="login-btn">Entrar</button>
    <div class="login-error" id="login-error">E-mail ou senha incorretos.</div>
  </div>
</div>

<div id="app" class="app" style="display:none">
  <div class="sidebar">
    <div class="logo-area"><img src="logo-branco.png" alt="Estratégia Contábil"></div>
    <nav class="nav">
      <div class="nav-section">Principal</div>
      <div class="nav-item active" onclick="ir('dashboard',this)"><i class="ti ti-layout-dashboard"></i> Dashboard</div>
      <div class="nav-item" onclick="ir('clientes',this)"><i class="ti ti-users"></i> Clientes</div>
      <div class="nav-section">Operacional</div>
      <div class="nav-item" onclick="ir('demandas',this)"><i class="ti ti-checkbox"></i> Demandas</div>
      <div class="nav-item" onclick="ir('documentos',this)"><i class="ti ti-folder"></i> Documentos</div>
      <div class="nav-section">Financeiro</div>
      <div class="nav-item" onclick="ir('receber',this)"><i class="ti ti-trending-up"></i> Contas a receber</div>
      <div class="nav-item" onclick="ir('pagar',this)"><i class="ti ti-trending-down"></i> Contas a pagar</div>
      <div class="nav-section">Relatórios</div>
      <div class="nav-item" onclick="ir('relatorios',this)"><i class="ti ti-report"></i> Relatórios</div>
      <div class="nav-section">Sistema</div>
      <div class="nav-item" onclick="ir('configuracoes',this)"><i class="ti ti-settings"></i> Configurações</div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-row">
        <div class="user-avatar">NS</div>
        <div><div class="user-name">Natana Santos</div><div class="user-role">Contadora</div></div>
        <button class="logout-btn" onclick="logout()"><i class="ti ti-logout"></i></button>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="page-title">Dashboard</div>
      <div class="topbar-badge" id="topbar-mes"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SB_URL = 'https://kkfejhkxxgcyfdqjlysg.supabase.co';
const SB_KEY = 'sb_publishable_KyMX7Ju85qr8Cq8IGpVfcg_Zl_isWEP';
let TOKEN = localStorage.getItem('sb_token') || '';
const meses = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const hoje = new Date();
let mesSel = hoje.getMonth();
let anoSel = hoje.getFullYear();

document.getElementById('topbar-mes').textContent = meses[hoje.getMonth()] + ' ' + hoje.getFullYear();

// AUTH
async function api(path, method='GET', body=null) {
  const opts = { method, headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json', 'Prefer': 'return=representation' } };
  if (body) opts.body = JSON.stringify(body);
  let r = await fetch(SB_URL + '/rest/v1/' + path, opts);
  if (r.status === 401) {
    const renovou = await renovarToken();
    if (renovou) {
      opts.headers['Authorization'] = 'Bearer ' + TOKEN;
      r = await fetch(SB_URL + '/rest/v1/' + path, opts);
    } else {
      logout();
      return [];
    }
  }
  if (r.status === 204) return [];
  return r.json();
}

async function renovarToken() {
  const refresh = localStorage.getItem('sb_refresh');
  if (!refresh) return false;
  try {
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
      body: JSON.stringify({ refresh_token: refresh })
    });
    const d = await r.json();
    if (d.access_token) {
      TOKEN = d.access_token;
      localStorage.setItem('sb_token', TOKEN);
      if (d.refresh_token) localStorage.setItem('sb_refresh', d.refresh_token);
      return true;
    }
    return false;
  } catch(e) { return false; }
}

async function login() {
  const email = document.getElementById('login-email').value.trim();
  const senha = document.getElementById('login-senha').value;
  const erro = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  erro.style.display = 'none';
  btn.textContent = 'Entrando...'; btn.disabled = true;
  try {
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SB_KEY },
      body: JSON.stringify({ email, password: senha })
    });
    const d = await r.json();
    if (d.access_token) {
      TOKEN = d.access_token;
      localStorage.setItem('sb_token', TOKEN);
      if (d.refresh_token) localStorage.setItem('sb_refresh', d.refresh_token);
      iniciar();
    } else { erro.style.display = 'block'; btn.textContent = 'Entrar'; btn.disabled = false; }
  } catch(e) { erro.style.display = 'block'; btn.textContent = 'Entrar'; btn.disabled = false; }
}

function logout() { localStorage.removeItem('sb_token'); localStorage.removeItem('sb_refresh'); TOKEN = ''; document.getElementById('app').style.display='none'; document.getElementById('login-page').style.display='flex'; }
function iniciar() { document.getElementById('login-page').style.display='none'; document.getElementById('app').style.display='flex'; ir('dashboard'); }

document.getElementById('login-btn').onclick = login;
document.getElementById('login-senha').onkeydown = e => { if(e.key==='Enter') login(); };

// NAVEGAÇÃO
const titulos = { dashboard:'Dashboard', clientes:'Clientes', demandas:'Demandas', documentos:'Documentos', receber:'Contas a receber', pagar:'Contas a pagar', relatorios:'Relatórios', configuracoes:'Configurações' };
function ir(pag, el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (el) el.classList.add('active');
  else { const ni = document.querySelector(`.nav-item[onclick*="${pag}"]`); if(ni) ni.classList.add('active'); }
  document.getElementById('page-title').textContent = titulos[pag] || pag;
  const c = document.getElementById('content');
  c.innerHTML = '<div style="text-align:center;padding:40px;color:#9CA3AF"><i class="ti ti-loader" style="font-size:32px"></i><br>Carregando...</div>';
  setTimeout(() => { if(pag==='dashboard') pagDashboard(); else if(pag==='clientes') pagClientes(); else if(pag==='demandas') pagDemandas(); else if(pag==='documentos') pagDocumentos(); else if(pag==='receber') pagReceber(); else if(pag==='pagar') pagPagar(); else if(pag==='relatorios') pagRelatorios(); else if(pag==='configuracoes') pagConfig(); }, 200);
}

function toast(msg, tipo='') { const t=document.getElementById('toast'); t.textContent=msg; t.className=`toast show ${tipo}`; setTimeout(()=>t.className='toast',3000); }
function fmt(v) { return 'R$ '+(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2}); }

// DASHBOARD
async function pagDashboard() {
  const clientes = await api('clientes?select=id,razao_social,honorario&status=eq.Ativo');
  const clienteObs = await api('cliente_obrigacoes?select=cliente_id,obrigacao_id');
  const demandasFeitas = await api(`demandas?mes=eq.${mesSel}&ano=eq.${anoSel}&feito=eq.true&select=cliente_id,obrigacao_id`);
  const feitoSet = new Set(demandasFeitas.map(d => d.cliente_id+'-'+d.obrigacao_id));
  const totalDemandas = clienteObs.length;
  const feitos = clienteObs.filter(co => feitoSet.has(co.cliente_id+'-'+co.obrigacao_id)).length;
  const pendentes = totalDemandas - feitos;
  const pctFeito = totalDemandas > 0 ? Math.round(feitos/totalDemandas*100) : 0;
  const pctPendente = totalDemandas > 0 ? 100 - pctFeito : 0;
  const c = document.getElementById('content');
  const total = clientes.reduce((s,x)=>s+(x.honorario||0),0);
  c.innerHTML = `
    <div style="margin-bottom:24px"><div style="font-size:20px;font-weight:600;color:var(--navy);margin-bottom:4px">Bem-vinda, Natana! 👋</div><div style="font-size:13px;color:#9CA3AF">Seu sistema está funcionando! <span style="color:var(--gold);font-weight:500">Comece cadastrando seus clientes.</span></div></div>
    <div class="grid-4">
      <div class="metric"><div class="metric-label">Clientes ativos</div><div class="metric-value">${clientes.length}</div></div>
      <div class="metric"><div class="metric-label">Demandas do mês</div><div class="metric-value">${totalDemandas}</div><div class="metric-sub">${meses[mesSel]}/${anoSel}</div></div>
      <div class="metric"><div class="metric-label">Honorários mensais</div><div class="metric-value">${fmt(total)}</div></div>
      <div class="metric"><div class="metric-label">Sistema</div><div class="metric-value" style="font-size:14px;color:var(--success)">✅ Online</div></div>
    </div>
    <div class="grid-2">
      <div class="metric" style="border-left-color:var(--warning)">
        <div class="metric-label">Demandas a fazer</div>
        <div class="metric-value" style="color:var(--warning)">${pendentes}</div>
        <div class="metric-sub">${pctPendente}% do total pendente</div>
      </div>
      <div class="metric" style="border-left-color:var(--success)">
        <div class="metric-label">Demandas concluídas</div>
        <div class="metric-value" style="color:var(--success)">${feitos}</div>
        <div class="metric-sub">${pctFeito}% do total concluído</div>
      </div>
    </div>
    <div class="card"><div class="card-header"><div class="card-title">🚀 Próximos passos</div></div><div class="card-body"><div style="display:flex;flex-direction:column;gap:10px;font-size:13px;color:#4B5563"><div>1️⃣ Cadastre as obrigações em <strong>Configurações</strong></div><div>2️⃣ Cadastre seus clientes com honorários e obrigações</div><div>3️⃣ Acompanhe as demandas mensais e dê baixa ao concluir</div><div>4️⃣ Controle honorários e despesas no financeiro</div></div></div></div>`;
}

// CLIENTES
async function pagClientes() {
  const clientes = await api('clientes?select=*&order=razao_social');
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="page-header">
      <div class="page-header-title">Clientes cadastrados (${clientes.length})</div>
      <button class="btn btn-navy" onclick="abrirModalCliente()"><i class="ti ti-plus"></i> Novo cliente</button>
    </div>
    <div class="card">
      <table class="table">
        <thead><tr><th>Empresa</th><th>CNPJ</th><th>Regime</th><th>Segmento</th><th>Honorários</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody id="tb-clientes">
          ${clientes.length === 0 ? '<tr><td colspan="7"><div class="empty-state"><i class="ti ti-users"></i>Nenhum cliente cadastrado ainda.<br><br><button class="btn btn-navy" onclick="abrirModalCliente()"><i class="ti ti-plus"></i> Cadastrar primeiro cliente</button></div></td></tr>' :
          clientes.map(cl => `<tr>
            <td><div style="font-weight:500">${cl.razao_social}</div><div style="font-size:11px;color:#9CA3AF">${cl.nome_fantasia||''}</div></td>
            <td>${cl.cnpj||'—'}</td>
            <td><span class="badge badge-info">${cl.regime||'—'}</span></td>
            <td>${cl.segmento||'—'}</td>
            <td>${fmt(cl.honorario)}</td>
            <td><span class="badge ${cl.status==='Ativo'?'badge-success':'badge-warning'}">${cl.status||'Ativo'}</span></td>
            <td><div style="display:flex;gap:6px">
              <button class="btn btn-sm" onclick="editarCliente('${cl.id}')"><i class="ti ti-edit"></i></button>
              <button class="btn btn-sm btn-danger" onclick="excluirCliente('${cl.id}','${cl.razao_social}')"><i class="ti ti-trash"></i></button>
            </div></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
    <!-- MODAL CLIENTE -->
    <div class="overlay" id="ov-cliente">
      <div class="modal" style="width:640px">
        <div class="modal-title" id="modal-cliente-titulo">Novo cliente</div>
        <div class="modal-sub">Preencha os dados do cliente</div>
        <div class="modal-tabs">
          <div class="modal-tab active" onclick="tab(0,this)">Dados cadastrais</div>
          <div class="modal-tab" onclick="tab(1,this)">Endereço/CNAE</div>
          <div class="modal-tab" onclick="tab(2,this)">Sócios</div>
          <div class="modal-tab" onclick="tab(3,this)">Obrigações</div>
          <div class="modal-tab" onclick="tab(4,this)">Honorários</div>
          <div class="modal-tab" onclick="tab(5,this)">Observações</div>
        </div>
        <div id="tab0">
          <div class="form-grid-2" style="margin-bottom:12px">

function tab(idx, el) {

  document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
}

async function carregarObrigacoesModal(selectedIds=[]) {
  const obrigacoes = await api('obrigacoes?order=nome');
  const lista = document.getElementById('obrig-lista');
  if (!lista) return;
  if (obrigacoes.length === 0) { lista.innerHTML = '<p style="color:#9CA3AF;font-size:13px">Nenhuma obrigação cadastrada. Vá em Configurações para cadastrar.</p>'; return; }
  lista.innerHTML = obrigacoes.map(ob => `
    <div class="obrig-check-item ${selectedIds.includes(ob.id)?'selected':''}" onclick="this.classList.toggle('selected');this.querySelector('input').checked=!this.querySelector('input').checked">
      <input type="checkbox" id="ob-${ob.id}" value="${ob.id}" ${selectedIds.includes(ob.id)?'checked':''} onclick="event.stopPropagation()">
      <div style="flex:1"><div style="font-size:13px;font-weight:500">${ob.nome}</div><div style="font-size:11px;color:#9CA3AF">${ob.prazo} · ${ob.periodicidade} · ${ob.regime}</div></div>
    </div>`).join('');
}

async function buscarCNPJ() {
  const cnpjInput = document.getElementById('c-cnpj');
  const status = document.getElementById('cnpj-status');
  const cnpjNumeros = cnpjInput.value.replace(/\D/g, '');
  if (cnpjNumeros.length !== 14) { if (status) status.textContent = ''; return; }
  status.textContent = 'Buscando dados na Receita Federal...';
  status.style.color = '#9CA3AF';
  try {
    const r = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpjNumeros}`);
    if (!r.ok) throw new Error('não encontrado');
    const d = await r.json();
    const razao = document.getElementById('c-razao');
    const fantasia = document.getElementById('c-fantasia');
    const abertura = document.getElementById('c-abertura');
    const tel = document.getElementById('c-tel');
    const regime = document.getElementById('c-regime');
    const cep = document.getElementById('c-cep');
    const uf = document.getElementById('c-uf');
    const logradouro = document.getElementById('c-logradouro');
    const numero = document.getElementById('c-numero');
    const complemento = document.getElementById('c-complemento');
    const bairro = document.getElementById('c-bairro');
    const municipio = document.getElementById('c-municipio');
    const cnaeCodigo = document.getElementById('c-cnae-codigo');
    const cnaeDescricao = document.getElementById('c-cnae-descricao');
    const cnaesSecundarios = document.getElementById('c-cnaes-secundarios');
    if (razao && !razao.value.trim()) razao.value = d.razao_social || '';
    if (fantasia && !fantasia.value.trim()) fantasia.value = d.nome_fantasia || '';
    if (abertura && !abertura.value && d.data_inicio_atividade) abertura.value = d.data_inicio_atividade;
    if (tel && !tel.value.trim() && d.ddd_telefone_1) tel.value = d.ddd_telefone_1;
    if (regime && d.opcao_pelo_simples === true) regime.value = 'Simples Nacional';
    if (cep && !cep.value.trim()) cep.value = d.cep || '';
    if (uf && !uf.value.trim()) uf.value = d.uf || '';
    if (logradouro && !logradouro.value.trim()) logradouro.value = d.logradouro || '';
    if (numero && !numero.value.trim()) numero.value = d.numero || '';
    if (complemento && !complemento.value.trim()) complemento.value = d.complemento || '';
    if (bairro && !bairro.value.trim()) bairro.value = d.bairro || '';
    if (municipio && !municipio.value.trim()) municipio.value = d.municipio || '';
    if (cnaeCodigo && !cnaeCodigo.value.trim() && d.cnae_fiscal) cnaeCodigo.value = d.cnae_fiscal;
    if (cnaeDescricao && !cnaeDescricao.value.trim() && d.cnae_fiscal_descricao) cnaeDescricao.value = d.cnae_fiscal_descricao;
    if (cnaesSecundarios && !cnaesSecundarios.value.trim() && Array.isArray(d.cnaes_secundarios) && d.cnaes_secundarios.length) {
      cnaesSecundarios.value = d.cnaes_secundarios.map(c => `${c.codigo} - ${c.descricao}`).join('\n');
    }
    status.textContent = 'Dados preenchidos automaticamente ✓';
    status.style.color = 'var(--success)';
  } catch (e) {
    status.textContent = 'CNPJ não encontrado ou serviço indisponível no momento.';
    status.style.color = 'var(--danger)';
  }
}

let sociosTemp = [];

function renderSociosLista() {
  const lista = document.getElementById('socios-lista');
  if (!lista) return;
  if (sociosTemp.length === 0) { lista.innerHTML = '<p style="color:#9CA3AF;font-size:13px">Nenhum sócio adicionado ainda.</p>'; return; }
  lista.innerHTML = sociosTemp.map((s, i) => `
    <div class="obrig-check-item" style="cursor:default">
      <div style="flex:1"><div style="font-size:13px;font-weight:500">${s.nome}</div><div style="font-size:11px;color:#9CA3AF">${s.cpf||'—'} · ${s.data_nascimento ? formatarDataBR(s.data_nascimento) : '—'}</div></div>
      <button class="btn btn-sm btn-danger" onclick="removerSocioTemp(${i})"><i class="ti ti-trash"></i></button>
    </div>`).join('');
}

function adicionarSocioTemp() {
  const nome = document.getElementById('socio-nome').value.trim();
  const cpf = document.getElementById('socio-cpf').value.trim();
  const nascimento = document.getElementById('socio-nascimento').value;
  if (!nome) { toast('Digite o nome do sócio!', 'error'); return; }
  sociosTemp.push({ nome, cpf, data_nascimento: nascimento || null });
  document.getElementById('socio-nome').value = '';
  document.getElementById('socio-cpf').value = '';
  document.getElementById('socio-nascimento').value = '';
  renderSociosLista();
}

function removerSocioTemp(i) {
  sociosTemp.splice(i, 1);
  renderSociosLista();
}

function formatarDataBR(iso) {
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

async function salvarCliente() {
  const id = document.getElementById('c-id').value;
  const razao = document.getElementById('c-razao').value.trim();
  if (!razao) { toast('Preencha a razão social!', 'error'); return; }
  if (document.getElementById('socio-nome').value.trim()) adicionarSocioTemp();
  const dados = {
    razao_social: razao,
    nome_fantasia: document.getElementById('c-fantasia').value,
    cnpj: document.getElementById('c-cnpj').value,
    inscricao_estadual: document.getElementById('c-ie').value,
    inscricao_municipal: document.getElementById('c-im').value,
    data_abertura: document.getElementById('c-abertura').value || null,
    data_inicio: document.getElementById('c-inicio').value || null,
    responsavel: document.getElementById('c-responsavel').value,
    telefone: document.getElementById('c-tel').value,
    email: document.getElementById('c-email').value,
    regime: document.getElementById('c-regime').value,
    segmento: document.getElementById('c-segmento').value,
    honorario: parseFloat(document.getElementById('c-honorario').value)||0,
    dia_vencimento: parseInt(document.getElementById('c-venc').value)||5,
    forma_cobranca: document.getElementById('c-cobranca').value,
    chave_pix: document.getElementById('c-pix').value,
    observacoes: document.getElementById('c-obs').value,
    cep: document.getElementById('c-cep').value,
    uf: document.getElementById('c-uf').value,
    logradouro: document.getElementById('c-logradouro').value,
    numero_endereco: document.getElementById('c-numero').value,
    complemento: document.getElementById('c-complemento').value,
    bairro: document.getElementById('c-bairro').value,
    municipio: document.getElementById('c-municipio').value,
    cnae_codigo: document.getElementById('c-cnae-codigo').value,
    cnae_descricao: document.getElementById('c-cnae-descricao').value,
    cnaes_secundarios: document.getElementById('c-cnaes-secundarios').value,
    status: 'Ativo'
  };
  let clienteId = id;
  if (id) {
    await api(`clientes?id=eq.${id}`, 'PATCH', dados);
    await api(`cliente_obrigacoes?cliente_id=eq.${id}`, 'DELETE');
    await api(`socios?cliente_id=eq.${id}`, 'DELETE');
  } else {
    const res = await api('clientes', 'POST', dados);
    clienteId = res[0]?.id;
  }
  // Salvar sócios
  for (const s of sociosTemp) {
    await api('socios', 'POST', { cliente_id: clienteId, nome: s.nome, cpf: s.cpf, data_nascimento: s.data_nascimento });
  }
  // Salvar obrigações
  const checks = document.querySelectorAll('#obrig-lista input[type=checkbox]:checked');
  for (const ch of checks) {
    await api('cliente_obrigacoes', 'POST', { cliente_id: clienteId, obrigacao_id: ch.value });
  }
  fecharModal('ov-cliente');
  toast(id ? 'Cliente atualizado!' : 'Cliente cadastrado!', 'success');
  pagClientes();
}

async function excluirCliente(id, nome) {
  if (!confirm(`Excluir "${nome}"? Esta ação não pode ser desfeita.`)) return;
  await api(`clientes?id=eq.${id}`, 'DELETE');
  toast('Cliente excluído!', 'success');
  pagClientes();
}

async function verDemanda(obId, obNome) {
  const clienteObs = await api(`cliente_obrigacoes?obrigacao_id=eq.${obId}&select=cliente_id,clientes(id,razao_social)`);
  const demandas = await api(`demandas?obrigacao_id=eq.${obId}&mes=eq.${mesSel}&ano=eq.${anoSel}`);
  const feitosIds = demandas.filter(d=>d.feito).map(d=>d.cliente_id);
  const total = clienteObs.length;
  const feitos = feitosIds.length;
  const pct = total > 0 ? Math.round(feitos/total*100) : 0;
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="page-header">
      <button class="btn" onclick="pagDemandas()"><i class="ti ti-arrow-left"></i> Voltar</button>
    </div>
    <div class="card">
      <div class="card-header">
        <div style="font-weight:600;color:var(--navy);font-size:15px">${obNome} — ${meses[mesSel]} ${anoSel}</div>
        <div style="font-size:13px;color:#9CA3AF">${feitos}/${total} concluídos · ${pct}%</div>
      </div>
      <div style="padding:16px 20px;background:#F9FAFB;border-bottom:1px solid #E5E7EB">
        <div style="background:#E5E7EB;border-radius:99px;height:8px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${pct===100?'var(--success)':pct>0?'var(--gold)':'var(--danger)'};border-radius:99px;transition:width 0.4s"></div>
        </div>
      </div>
      <table class="table">

async function uploadDocumento(clienteId) {
  const fileInput = document.getElementById('doc-arquivo');
  const tipo = document.getElementById('doc-tipo').value;
  const file = fileInput.files[0];
  if (!file) { toast('Escolha um arquivo!', 'error'); return; }
  const btn = document.getElementById('btn-upload-doc');
  const textoOriginal = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader"></i> Enviando...';
  try {
    const path = `${clienteId}/${anoSel}-${String(mesSel+1).padStart(2,'0')}/${Date.now()}-${file.name}`;
    const r = await fetch(`${SB_URL}/storage/v1/object/documentos/${path}`, {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': file.type || 'application/octet-stream' },
      body: file
    });
    if (!r.ok) throw new Error('falha no upload');
    await api('documentos', 'POST', { cliente_id: clienteId, mes: mesSel, ano: anoSel, nome_arquivo: file.name, tipo, storage_path: path });
    toast('Arquivo anexado!', 'success');
    verPastaCliente(clienteId);
  } catch (e) {
    toast('Erro ao anexar arquivo. Tente novamente.', 'error');
  } finally {
    btn.disabled = false; btn.innerHTML = textoOriginal;
  }
}

async function baixarDocumento(i) {
  const d = window._documentosAtual[i];
  const r = await fetch(`${SB_URL}/storage/v1/object/sign/documentos/${d.storage_path}`, {
    method: 'POST',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' },
    body: JSON.stringify({ expiresIn: 3600 })
  });
  const data = await r.json();
  if (data.signedURL) {
    window.open(SB_URL + '/storage/v1' + data.signedURL, '_blank');
  } else {
    toast('Erro ao gerar link de download.', 'error');
  }
}

async function excluirDocumento(i) {
  const d = window._documentosAtual[i];
  if (!confirm(`Excluir "${d.nome_arquivo}"?`)) return;
  await fetch(`${SB_URL}/storage/v1/object/documentos/${d.storage_path}`, {
    method: 'DELETE',
    headers: { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + TOKEN }
  });
  await api(`documentos?id=eq.${d.id}`, 'DELETE');
  toast('Arquivo excluído!', 'success');
  verPastaCliente(d.cliente_id);
}

async function enviarDocumentosWhats(clienteId) {
  const cl = (await api(`clientes?id=eq.${clienteId}&select=razao_social,telefone`))[0];
  const telefone = (cl.telefone||'').replace(/\D/g,'');
  if (!telefone) { toast('Este cliente não tem telefone cadastrado.', 'error'); return; }
  const numero = telefone.startsWith('55') ? telefone : '55'+telefone;
  const mensagem = `Olá! Segue a situação fiscal e as guias de ${meses[mesSel]}/${anoSel} da ${cl.razao_social}. Qualquer dúvida estamos à disposição!`;
  window.open(`https://web.whatsapp.com/send?phone=${numero}&text=${encodeURIComponent(mensagem)}`, '_blank');
}

async function pagReceber() {
  const clientes = await api('clientes?status=eq.Ativo&select=*&order=razao_social');

    const pag = pagamentos.find(p => p.cliente_id === cl.id);
    const recebido = pag?.valor_recebido || 0;
    const aberto = (cl.honorario||0) - recebido;
    totalReceber += (cl.honorario||0);
    totalRecebido += recebido;
    const status = recebido <= 0 ? 'Inadimplente' : recebido >= (cl.honorario||0) ? 'Pago' : 'Parcial';

    return `<tr>
      <td style="font-weight:500">${cl.razao_social}${pag ? `<br><span style="font-size:11px;color:#9CA3AF">Recebido em ${pag.data_recebimento||'—'}</span>` : ''}</td>

      <td>${fmt(recebido)}</td>
      <td>${aberto > 0 ? `<span style="color:var(--danger);font-weight:500">${fmt(aberto)}</span>` : '<span style="color:var(--success)">Quitado</span>'}</td>
      <td><span class="badge ${badgeClass}">${status}</span></td>
      <td>${status !== 'Pago' ? `<button class="btn btn-sm btn-navy" onclick="abrirBaixaHon('${cl.id}','${cl.razao_social}',${cl.honorario},${recebido})"><i class="ti ti-cash"></i> Baixa</button>` : '✅'}</td>
    </tr>`;
  }).join('');

  c.innerHTML = `
    <div class="page-header">
      <div class="page-header-title">Honorários — ${meses[mesSel]} ${anoSel}</div>
      <div style="display:flex;gap:8px">
        <select onchange="mesSel=parseInt(this.value);pagReceber()" style="height:36px;padding:0 10px;border-radius:8px;border:1px solid #E5E7EB;font-size:13px">
          ${meses.map((m,i)=>`<option value="${i}" ${i===mesSel?'selected':''}>${m}</option>`).join('')}
        </select>
        <input type="number" value="${anoSel}" onchange="anoSel=parseInt(this.value);pagReceber()" style="height:36px;width:80px;padding:0 10px;border-radius:8px;border:1px solid #E5E7EB;font-size:13px">
      </div>
    </div>
    <div class="grid-4">
      <div class="metric"><div class="metric-label">Total a receber</div><div class="metric-value">${fmt(totalReceber)}</div></div>
      <div class="metric"><div class="metric-label">Recebido</div><div class="metric-value" style="color:var(--success)">${fmt(totalRecebido)}</div></div>
      <div class="metric"><div class="metric-label">Em aberto</div><div class="metric-value" style="color:var(--danger)">${fmt(totalReceber-totalRecebido)}</div></div>
      <div class="metric"><div class="metric-label">Inadimplentes</div><div class="metric-value" style="color:var(--danger)">${clientes.filter(cl=>!(pagamentos.find(p=>p.cliente_id===cl.id)?.valor_recebido>0)).length}</div></div>
    </div>
    <div class="card">
      <table class="table">
        <thead><tr><th>Cliente</th><th>Honorário</th><th>Recebido</th><th>Saldo aberto</th><th>Status</th><th>Ação</th></tr></thead>
        <tbody>${rows||'<tr><td colspan="6" style="text-align:center;padding:24px;color:#9CA3AF">Nenhum cliente cadastrado ainda.</td></tr>'}</tbody>
      </table>
    </div>
    <div class="overlay" id="ov-baixa-hon">
      <div class="modal" style="width:400px">
        <div class="modal-title" id="baixa-hon-titulo">Dar baixa</div>
        <div class="modal-sub" id="baixa-hon-sub"></div>
        <div class="field"><label>Valor recebido (R$)</label><input type="number" id="baixa-valor" placeholder="0,00"></div>

        <div class="modal-footer">
          <input type="hidden" id="baixa-cliente-id">

          <button class="btn btn-success" onclick="salvarBaixaHon()"><i class="ti ti-check"></i> Confirmar</button>
        </div>
      </div>
    </div>`;
}

async function salvarBaixaHon() {
  const clienteId = document.getElementById('baixa-cliente-id').value;
  const valor = parseFloat(document.getElementById('baixa-valor').value)||0;

async function salvarObrig() {
  const id = document.getElementById('ob-id').value;
  const nome = document.getElementById('ob-nome').value.trim();
  if (!nome) { toast('Digite o nome da obrigação!','error'); return; }
  const dados = { nome, prazo: document.getElementById('ob-prazo').value, periodicidade: document.getElementById('ob-period').value, regime: document.getElementById('ob-regime').value };
  if (id) { await api(`obrigacoes?id=eq.${id}`, 'PATCH', dados); } else { await api('obrigacoes','POST',dados); }
  fecharModal('ov-obrig');
  toast(id ? 'Obrigação atualizada!' : 'Obrigação cadastrada!','success');
  document.getElementById('demandas-content') ? pagDemandas() : pagConfig();
}

async function excluirObrig(id, nome) {
  if (!confirm(`Excluir "${nome}"?`)) return;
  await api(`obrigacoes?id=eq.${id}`, 'DELETE');
  toast('Obrigação excluída!','success');
  document.getElementById('demandas-content') ? pagDemandas() : pagConfig();
}

// BACKUP
async function baixarBackup() {
  const btn = document.getElementById('btn-backup');
  const textoOriginal = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader"></i> Gerando backup...';
  try {
    const tabelas = ['clientes','obrigacoes','cliente_obrigacoes','demandas','categorias','grupos_despesa','despesas','honorarios_pagamentos','despesas_pagamentos'];
    const backup = { gerado_em: new Date().toISOString() };
    for (const t of tabelas) { backup[t] = await api(`${t}?select=*`); }
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `backup-estrategia-contabil-${new Date().toISOString().split('T')[0]}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast('Backup baixado com sucesso!','success');
  } catch (e) {
    toast('Erro ao gerar backup. Tente novamente.','error');
  } finally {
    btn.disabled = false; btn.innerHTML = textoOriginal;
  }
}

// RELATÓRIOS
let relatorioTab = 'geral';
let relatorioObrigId = '';

function relTabBtn(id, label) {
  return `<button class="btn btn-sm ${relatorioTab===id?'btn-navy':''}" onclick="relatorioTab='${id}';pagRelatorios()">${label}</button>`;
}

async function pagRelatorios() {
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="page-header">
      <div class="page-header-title">Relatórios — ${meses[mesSel]} ${anoSel}</div>
      <div style="display:flex;gap:8px">
        <select onchange="mesSel=parseInt(this.value);pagRelatorios()" style="height:36px;padding:0 10px;border-radius:8px;border:1px solid #E5E7EB;font-size:13px">
          ${meses.map((m,i)=>`<option value="${i}" ${i===mesSel?'selected':''}>${m}</option>`).join('')}
        </select>
        <input type="number" value="${anoSel}" onchange="anoSel=parseInt(this.value);pagRelatorios()" style="height:36px;width:80px;padding:0 10px;border-radius:8px;border:1px solid #E5E7EB;font-size:13px">
        <button class="btn btn-navy" onclick="window.print()"><i class="ti ti-printer"></i> Imprimir</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
      ${relTabBtn('geral','Visão geral')}
      ${relTabBtn('demanda','Por demanda')}
      ${relTabBtn('periodo','A vencer / Vencidas')}
      ${relTabBtn('financeiro','Financeiro')}
      ${relTabBtn('aniversariantes','Aniversariantes')}
    </div>
    <div id="relatorio-body"><div style="text-align:center;padding:40px;color:#9CA3AF"><i class="ti ti-loader" style="font-size:32px"></i><br>Carregando...</div></div>`;
  if (relatorioTab === 'geral') renderRelatorioGeral();
  else if (relatorioTab === 'demanda') renderRelatorioPorDemanda();
  else if (relatorioTab === 'periodo') renderRelatorioPeriodo();
  else if (relatorioTab === 'financeiro') renderRelatorioFinanceiro();
  else if (relatorioTab === 'aniversariantes') renderRelatorioAniversariantes();
}

async function renderRelatorioGeral() {
  const clientes = await api('clientes?select=id,razao_social,status&order=razao_social');
  const clienteObs = await api('cliente_obrigacoes?select=cliente_id,obrigacao_id');
  const demandasFeitas = await api(`demandas?mes=eq.${mesSel}&ano=eq.${anoSel}&feito=eq.true&select=cliente_id,obrigacao_id`);
  const feitoSet = new Set(demandasFeitas.map(d => d.cliente_id+'-'+d.obrigacao_id));
  const totalDemandas = clienteObs.length;
  const totalFeitas = clienteObs.filter(co => feitoSet.has(co.cliente_id+'-'+co.obrigacao_id)).length;
  const pctGeral = totalDemandas > 0 ? Math.round(totalFeitas/totalDemandas*100) : 0;

  const porCliente = clientes.map(cl => {
    const obsCliente = clienteObs.filter(co => co.cliente_id === cl.id);
    const total = obsCliente.length;
    const feitas = obsCliente.filter(co => feitoSet.has(co.cliente_id+'-'+co.obrigacao_id)).length;
    const pct = total > 0 ? Math.round(feitas/total*100) : 0;
    return { cl, total, feitas, pct };
  });

  const body = document.getElementById('relatorio-body');
  body.innerHTML = `
    <div class="grid-4">
      <div class="metric"><div class="metric-label">Total de clientes</div><div class="metric-value">${clientes.length}</div></div>
      <div class="metric"><div class="metric-label">Total de demandas</div><div class="metric-value">${totalDemandas}</div></div>
      <div class="metric"><div class="metric-label">Concluídas</div><div class="metric-value" style="color:var(--success)">${totalFeitas} <span style="font-size:13px;color:#9CA3AF">(${pctGeral}%)</span></div></div>
      <div class="metric"><div class="metric-label">Pendentes</div><div class="metric-value" style="color:var(--danger)">${totalDemandas-totalFeitas}</div></div>
    </div>
    <div class="card">
      <div class="card-header"><div class="card-title">Demandas por cliente</div></div>
      <table class="table">
        <thead><tr><th>Cliente</th><th>Total de obrigações</th><th>Concluídas</th><th>Pendentes</th><th>%</th></tr></thead>
        <tbody>
          ${porCliente.length === 0 ? '<tr><td colspan="5" style="text-align:center;padding:24px;color:#9CA3AF">Nenhum dado disponível.</td></tr>' :
          porCliente.map(p => `<tr>
            <td style="font-weight:500">${p.cl.razao_social}${p.cl.status!=='Ativo'?` <span class="badge badge-warning">${p.cl.status}</span>`:''}</td>
            <td>${p.total}</td>
            <td>${p.feitas}</td>
            <td>${p.total-p.feitas}</td>
            <td><span class="badge ${p.pct===100?'badge-success':p.pct>0?'badge-warning':'badge-danger'}">${p.pct}%</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

async function renderRelatorioPorDemanda() {
  const obrigacoes = await api('obrigacoes?order=prazo');
  const body = document.getElementById('relatorio-body');
  body.innerHTML = `
    <div class="card">
      <div class="card-body">
        <div class="field" style="margin-bottom:0">
          <label>Selecione a demanda</label>
          <select id="rel-obrig-sel" onchange="relatorioObrigId=this.value;renderRelatorioPorDemandaLista()">
            <option value="">Selecione...</option>
            ${obrigacoes.map(ob=>`<option value="${ob.id}" ${ob.id===relatorioObrigId?'selected':''}>${ob.nome} (dia ${ob.prazo})</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    <div id="rel-obrig-lista" style="margin-top:16px"></div>`;
  if (relatorioObrigId) renderRelatorioPorDemandaLista();
}

async function renderRelatorioPorDemandaLista() {
  const lista = document.getElementById('rel-obrig-lista');
  if (!relatorioObrigId) { lista.innerHTML = ''; return; }
  lista.innerHTML = '<div style="text-align:center;padding:24px;color:#9CA3AF">Carregando...</div>';
  const clienteObs = await api(`cliente_obrigacoes?obrigacao_id=eq.${relatorioObrigId}&select=cliente_id,clientes(id,razao_social,status)`);
  const demandas = await api(`demandas?obrigacao_id=eq.${relatorioObrigId}&mes=eq.${mesSel}&ano=eq.${anoSel}`);
  const feitosIds = demandas.filter(d=>d.feito).map(d=>d.cliente_id);
  const total = clienteObs.length;
  const feitos = feitosIds.length;
  const pct = total > 0 ? Math.round(feitos/total*100) : 0;
  lista.innerHTML = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">${feitos}/${total} concluídos</div>
        <div style="font-size:13px;color:#9CA3AF">${pct}%</div>
      </div>
      <table class="table">
        <thead><tr><th>Cliente</th><th>Status</th></tr></thead>
        <tbody>
          ${total === 0 ? '<tr><td colspan="2" style="text-align:center;padding:24px;color:#9CA3AF">Nenhum cliente vinculado a esta obrigação.</td></tr>' :
          clienteObs.map(co => {
            const feito = feitosIds.includes(co.cliente_id);
            return `<tr>
              <td style="font-weight:500">${co.clientes?.razao_social||'—'}${co.clientes?.status&&co.clientes.status!=='Ativo'?` <span class="badge badge-warning">${co.clientes.status}</span>`:''}</td>
              <td><span class="badge ${feito?'badge-success':'badge-warning'}">${feito?'Concluído':'Pendente'}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

async function renderRelatorioPeriodo() {
  const obrigacoes = await api('obrigacoes?select=id,nome,prazo');
  const clienteObs = await api('cliente_obrigacoes?select=cliente_id,obrigacao_id,clientes(razao_social)');
  const demandasFeitas = await api(`demandas?mes=eq.${mesSel}&ano=eq.${anoSel}&feito=eq.true&select=cliente_id,obrigacao_id`);
  const feitoSet = new Set(demandasFeitas.map(d => d.cliente_id+'-'+d.obrigacao_id));
  const obMap = {};
  obrigacoes.forEach(ob => obMap[ob.id] = ob);
  const hoje = new Date();
  const linhas = clienteObs.map(co => {
    const ob = obMap[co.obrigacao_id];
    if (!ob) return null;
    const dia = parseInt(ob.prazo) || 1;
    const venc = new Date(anoSel, mesSel, dia);
    const feito = feitoSet.has(co.cliente_id+'-'+co.obrigacao_id);
    const status = feito ? 'Concluída' : (venc < hoje ? 'Vencida' : 'A vencer');
    return { cliente: co.clientes?.razao_social || '—', obrigacao: ob.nome, venc, status };
  }).filter(Boolean).sort((a,b) => a.venc - b.venc);

  const vencidas = linhas.filter(l => l.status === 'Vencida').length;
  const aVencer = linhas.filter(l => l.status === 'A vencer').length;
  const concluidas = linhas.filter(l => l.status === 'Concluída').length;

  const body = document.getElementById('relatorio-body');
  body.innerHTML = `
    <div class="grid-4" style="grid-template-columns:repeat(3,1fr)">
      <div class="metric" style="border-left-color:var(--danger)"><div class="metric-label">Vencidas</div><div class="metric-value" style="color:var(--danger)">${vencidas}</div></div>
      <div class="metric" style="border-left-color:var(--gold)"><div class="metric-label">A vencer</div><div class="metric-value" style="color:var(--gold)">${aVencer}</div></div>
      <div class="metric" style="border-left-color:var(--success)"><div class="metric-label">Concluídas</div><div class="metric-value" style="color:var(--success)">${concluidas}</div></div>
    </div>
    <div class="card">
      <table class="table">
        <thead><tr><th>Cliente</th><th>Obrigação</th><th>Vencimento</th><th>Status</th></tr></thead>
        <tbody>
          ${linhas.length === 0 ? '<tr><td colspan="4" style="text-align:center;padding:24px;color:#9CA3AF">Nenhuma demanda no período.</td></tr>' :
          linhas.map(l => `<tr>
            <td style="font-weight:500">${l.cliente}</td>
            <td>${l.obrigacao}</td>
            <td>${String(l.venc.getDate()).padStart(2,'0')}/${String(l.venc.getMonth()+1).padStart(2,'0')}</td>
            <td><span class="badge ${l.status==='Concluída'?'badge-success':l.status==='Vencida'?'badge-danger':'badge-warning'}">${l.status}</span></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

async function renderRelatorioFinanceiro() {
  const clientes = await api('clientes?select=id,status,honorario');
  const pagamentosMes = await api(`honorarios_pagamentos?mes=eq.${mesSel}&ano=eq.${anoSel}&select=cliente_id,valor_recebido`);
  const todosPagamentos = await api('honorarios_pagamentos?select=valor_recebido');
  const despesas = await api('despesas?select=valor');

  const totalClientes = clientes.length;
  const clientesAtivos = clientes.filter(c => c.status === 'Ativo').length;
  const faturamentoMes = clientes.filter(c => c.status === 'Ativo').reduce((s,c) => s+(c.honorario||0), 0);
  const honorariosPagos = pagamentosMes.reduce((s,p) => s+(p.valor_recebido||0), 0);
  const honorariosAberto = faturamentoMes - honorariosPagos;
  const faturamentoTotal = todosPagamentos.reduce((s,p) => s+(p.valor_recebido||0), 0);
  const totalDespesas = despesas.reduce((s,d) => s+(d.valor||0), 0);
  const resultadoMes = honorariosPagos - totalDespesas;

  const body = document.getElementById('relatorio-body');
  body.innerHTML = `
    <div class="grid-4">
      <div class="metric"><div class="metric-label">Total de clientes</div><div class="metric-value">${totalClientes}</div></div>
      <div class="metric"><div class="metric-label">Clientes ativos</div><div class="metric-value">${clientesAtivos}</div></div>
      <div class="metric"><div class="metric-label">Faturamento do mês</div><div class="metric-value">${fmt(faturamentoMes)}</div></div>
      <div class="metric"><div class="metric-label">Faturamento total (histórico)</div><div class="metric-value">${fmt(faturamentoTotal)}</div></div>
    </div>
    <div class="grid-4">
      <div class="metric" style="border-left-color:var(--success)"><div class="metric-label">Honorários pagos (mês)</div><div class="metric-value" style="color:var(--success)">${fmt(honorariosPagos)}</div></div>
      <div class="metric" style="border-left-color:var(--danger)"><div class="metric-label">Honorários em aberto (mês)</div><div class="metric-value" style="color:var(--danger)">${fmt(honorariosAberto)}</div></div>
      <div class="metric"><div class="metric-label">Despesas do mês</div><div class="metric-value">${fmt(totalDespesas)}</div></div>
      <div class="metric"><div class="metric-label">Resultado do mês</div><div class="metric-value" style="color:${resultadoMes>=0?'var(--success)':'var(--danger)'}">${fmt(resultadoMes)}</div></div>
    </div>`;
}

async function renderRelatorioAniversariantes() {
  const socios = await api('socios?select=id,nome,data_nascimento,cliente_id,clientes(razao_social,telefone)');
  const mesNum = String(mesSel+1).padStart(2,'0');
  const aniversariantes = socios
    .filter(s => s.data_nascimento && s.data_nascimento.split('-')[1] === mesNum)
    .map(s => ({ ...s, dia: parseInt(s.data_nascimento.split('-')[2]) }))
    .sort((a,b) => a.dia - b.dia);

  window._aniversariantesMsgs = [];
  const body = document.getElementById('relatorio-body');
  body.innerHTML = `
    <div class="card">
      <div class="card-header"><div class="card-title">Aniversariantes de ${meses[mesSel]}</div></div>
      <table class="table">
        <thead><tr><th>Dia</th><th>Sócio</th><th>Empresa</th><th>Ação</th></tr></thead>
        <tbody>
          ${aniversariantes.length === 0 ? '<tr><td colspan="4" style="text-align:center;padding:24px;color:#9CA3AF">Nenhum aniversariante em '+meses[mesSel]+'.</td></tr>' :
          aniversariantes.map((a, i) => {
            const telefone = (a.clientes?.telefone||'').replace(/\D/g,'');
            const numeroWhats = telefone ? (telefone.startsWith('55') ? telefone : '55'+telefone) : '';
            window._aniversariantesMsgs[i] = {
              numero: numeroWhats,
              mensagem: `⭐ Hoje é um dia especial!\n\nA equipe Estratégia Contábil passou para desejar um feliz aniversário e dizer que não esquecemos dessa data tão importante. ✨\n\nDesejamos muita saúde, felicidade, conquistas e prosperidade em seu novo ciclo.\n\nÉ uma satisfação ter você conosco. Obrigado pela confiança e parceria!\n\nFeliz aniversário ✨⭐❤️`
            };
            return `<tr>
              <td style="font-weight:500">${String(a.dia).padStart(2,'0')}/${mesNum}</td>
              <td>${a.nome}</td>
              <td>${a.clientes?.razao_social||'—'}</td>
              <td>${numeroWhats ? `<button class="btn btn-sm btn-success" onclick="enviarParabens(${i})"><i class="ti ti-brand-whatsapp"></i> Enviar parabéns</button>` : '<span style="color:#9CA3AF;font-size:12px">Sem telefone cadastrado</span>'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

async function enviarParabens(i) {
  const { numero, mensagem } = window._aniversariantesMsgs[i];
  const texto = encodeURIComponent(mensagem);
  window.open(`https://web.whatsapp.com/send?phone=${numero}&text=${texto}`, '_blank');
}

function fecharModal(id) { document.getElementById(id).classList.remove('show'); }

if (TOKEN) iniciar();
